<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>등록된 습득물 - AI 분실물 매칭</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- ==============================
         상단 메뉴
    =============================== -->

    <header>

        <div class="logo">
            AI 분실물 매칭
        </div>


        <nav>

            <a href="index.html">
                홈
            </a>

            <a href="lost-list.html">
                분실물 찾기
            </a>

            <a href="lost.html">
                분실물 등록
            </a>

            <a href="found.html">
                습득물 등록
            </a>

            <a href="match.html">
                AI 매칭
            </a>

            <a href="#">
                로그인
            </a>

        </nav>

    </header>


    <!-- ==============================
         페이지 제목
    =============================== -->

    <main>

        <section class="page-title">

            <h1>
                등록된 습득물
            </h1>

            <p>
                등록된 습득물을 확인할 수 있습니다.
            </p>

        </section>


        <!-- ==============================
             습득물 목록
        =============================== -->

        <section>

            <div
                id="foundItems"
                class="lost-items"
            >

                <p>
                    습득물 정보를 불러오는 중입니다...
                </p>

            </div>

        </section>

    </main>


    <!-- ==============================
         JavaScript
    =============================== -->

    <script>


        // FastAPI 서버 주소

        const API_URL =
            "https://lost-found-ai-0z75.onrender.com";



        // ==========================================
        // 습득물 목록 가져오기
        // ==========================================

        async function loadFoundItems() {

            try {

                const response =
                    await fetch(
                        API_URL + "/found-items"
                    );


                if (!response.ok) {

                    throw new Error(
                        "서버 응답 오류"
                    );

                }


                const items =
                    await response.json();


                displayFoundItems(items);


            }

            catch (error) {

                console.error(error);


                document.getElementById(
                    "foundItems"
                ).innerHTML = `

                    <div class="empty-message">

                        <h2>
                            습득물 정보를 불러오지 못했습니다.
                        </h2>

                        <p>
                            잠시 후 다시 시도해주세요.
                        </p>

                    </div>

                `;

            }

        }



        // ==========================================
        // 습득물 화면 표시
        // ==========================================

        function displayFoundItems(items) {

            const container =
                document.getElementById(
                    "foundItems"
                );


            // 습득물이 없는 경우

            if (items.length === 0) {

                container.innerHTML = `

                    <div class="empty-message">

                        <h2>
                            등록된 습득물이 없습니다.
                        </h2>

                        <p>
                            아직 등록된 습득물이 없습니다.
                        </p>

                    </div>

                `;

                return;

            }


            // 기존 내용 삭제

            container.innerHTML = "";


            // 습득물 하나씩 생성

            items.forEach(function(item) {


                // 카드 생성

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "lost-card";


                // ==================================
                // 사진 주소
                // ==================================

                let imageUrl = "";


                if (item.image_path) {

                    const fileName =
                        item.image_path
                            .split("\\")
                            .pop()
                            .split("/")
                            .pop();


                    imageUrl =
                        API_URL +
                        "/uploads/" +
                        encodeURIComponent(
                            fileName
                        );

                }


                // ==================================
                // 카드 내용
                // ==================================

                card.innerHTML = `

                    <div class="lost-image">

                        ${
                            imageUrl

                            ?

                            `<img
                                src="${imageUrl}"
                                alt="${item.item_name}"
                            >`

                            :

                            `<div>
                                사진 없음
                            </div>`
                        }

                    </div>


                    <div class="lost-info">

                        <h2>
                            ${item.item_name}
                        </h2>


                        <p>
                            📍 습득 장소:
                            ${item.location}
                        </p>


                        <p>
                            📅 습득 날짜:
                            ${item.found_date}
                        </p>


                        <p>
                            📝 설명:
                            ${item.description || "설명 없음"}
                        </p>


                        <div class="lost-id">

                            등록번호 :
                            ${item.id}

                        </div>


                        <!-- ==========================
                             삭제 버튼
                        =========================== -->

                        <button
                            onclick="deleteFoundItem(${item.id})"
                            style="
                                margin-top: 15px;
                                background-color: #dc2626;
                            "
                        >

                            삭제

                        </button>

                    </div>

                `;


                // 화면에 추가

                container.appendChild(
                    card
                );

            });

        }



        // ==========================================
        // 습득물 삭제
        // ==========================================

        async function deleteFoundItem(id) {


            // 삭제 확인

            const confirmDelete =
                confirm(
                    "정말 이 습득물을 삭제하시겠습니까?"
                );


            if (!confirmDelete) {

                return;

            }


            try {


                // FastAPI 삭제 요청

                const response =
                    await fetch(

                        API_URL +
                        "/found-items/" +
                        id,

                        {
                            method: "DELETE"
                        }

                    );


                const result =
                    await response.json();


                // 삭제 성공

                if (response.ok) {

                    alert(
                        "습득물이 삭제되었습니다."
                    );


                    // 목록 다시 불러오기

                    loadFoundItems();

                }


                // 삭제 실패

                else {

                    alert(

                        result.detail ||
                        "삭제에 실패했습니다."

                    );

                }

            }


            catch (error) {

                console.error(error);


                alert(
                    "서버와 연결할 수 없습니다."
                );

            }

        }



        // ==========================================
        // 페이지 실행
        // ==========================================

        loadFoundItems();


    </script>


</body>

</html>
