<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI 분실물 매칭 시스템</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <!-- 로고 -->
    <div class="logo">
        AI 분실물 매칭
    </div>


    <!-- 메뉴 -->
    <nav>

        <a href="index.html">
            홈
        </a>

        <a href="lost-list.html">
            분실물 찾기
        </a>

        <a href="lost.html">
            분실물 등록
        </a>

        <a href="found.html">
            습득물 등록
        </a>

        <a href="match.html">
            AI 매칭
        </a>

        <a href="#">
            로그인
        </a>

    </nav>

</header>


<main>


    <!-- =====================================
         메인 소개
    ====================================== -->

    <section class="page-title">

        <h1>
            잃어버린 물건,<br>
            AI가 찾아드립니다.
        </h1>

        <p>
            분실물과 습득물을 등록하면
            AI 이미지 분석을 통해
            유사한 물건을 자동으로 찾아드립니다.
        </p>

    </section>



    <!-- =====================================
         기능 카드
    ====================================== -->

    <section class="lost-items">


        <!-- 분실물 등록 -->

        <div class="lost-card">

            <div class="lost-info">

                <h2>
                    분실물 등록
                </h2>

                <p>
                    잃어버린 물건의 사진과
                    정보를 등록해주세요.
                </p>

                <button
                    onclick="location.href='lost.html'">
                    분실물 등록하기
                </button>

            </div>

        </div>



        <!-- 습득물 등록 -->

        <div class="lost-card">

            <div class="lost-info">

                <h2>
                    습득물 등록
                </h2>

                <p>
                    습득한 물건의 사진과
                    정보를 등록해주세요.
                </p>

                <button
                    onclick="location.href='found.html'">
                    습득물 등록하기
                </button>

            </div>

        </div>



        <!-- 분실물 찾기 -->

        <div class="lost-card">

            <div class="lost-info">

                <h2>
                    분실물 찾기
                </h2>

                <p>
                    등록된 분실물과 습득물의
                    정보를 확인할 수 있습니다.
                </p>

                <button
                    onclick="location.href='lost-list.html'">
                    분실물 확인하기
                </button>

            </div>

        </div>



        <!-- AI 매칭 -->

        <div class="lost-card">

            <div class="lost-info">

                <h2>
                    AI 자동 매칭
                </h2>

                <p>
                    AI가 분실물과 습득물의
                    사진을 비교하여
                    가장 유사한 물건을 찾아줍니다.
                </p>

                <button
                    onclick="location.href='match.html'">
                    AI 매칭 시작
                </button>

            </div>

        </div>


    </section>


</main>


</body>
</html>
